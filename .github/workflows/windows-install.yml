name: Windows install

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install from the public command in a path with spaces
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "中文 test project with spaces"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          Set-Location $testDir
          node -e "fetch('https://is.gd/chanyong_install').then(r=>r.ok?r.text():Promise.reject(Error('HTTP '+r.status))).then(eval).catch(e=>{console.error(e.message);process.exit(1)})"
          $members = @("chanyong", "design-taste-frontend", "dongwo", "chuangyi", "tuijian", "mishu", "xuanpin", "guihua", "beifen", "yanjiu", "cehua", "jiagou", "tishici", "chaijie", "juece", "fupan", "diannao", "zhishi", "jinengguan", "anquan", "zhaobug", "xiubug", "biancheng", "daimazhengli", "jianrong", "api", "bijia", "caigou", "gaojigongchengshi")
          foreach ($member in $members) {
            if (-not (Test-Path "$env:USERPROFILE\.agents\skills\$member\SKILL.md")) { throw "Global install missing: $member" }
            if (-not (Test-Path ".agents\skills\$member\SKILL.md")) { throw "Project install missing: $member" }
            if (-not (Test-Path "$env:USERPROFILE\.claude\skills\$member\SKILL.md")) { throw "Claude install missing: $member" }
            if (-not (Test-Path "$env:USERPROFILE\.grok\skills\$member\SKILL.md")) { throw "Grok install missing: $member" }
          }
          if ((Get-Content "$env:USERPROFILE\.agents\skills\chanyong\VERSION" -Raw).Trim() -ne "1.6.0") { throw "Wrong installed version" }
      - name: Install from Windows CMD
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\cmd test project with spaces"
          cd /d "%RUNNER_TEMP%\cmd test project with spaces"
          node -e "fetch('https://is.gd/chanyong_install').then(r=>r.ok?r.text():Promise.reject(Error('HTTP '+r.status))).then(eval).catch(e=>{console.error(e.message);process.exit(1)})"
          for %%S in (chanyong design-taste-frontend dongwo chuangyi tuijian mishu xuanpin guihua beifen yanjiu cehua jiagou tishici chaijie juece fupan diannao zhishi jinengguan anquan zhaobug xiubug biancheng daimazhengli jianrong api bijia caigou gaojigongchengshi) do (
            if not exist "%USERPROFILE%\.agents\skills\%%S\SKILL.md" exit /b 1
            if not exist ".agents\skills\%%S\SKILL.md" exit /b 1
            if not exist "%USERPROFILE%\.claude\skills\%%S\SKILL.md" exit /b 1
            if not exist "%USERPROFILE%\.grok\skills\%%S\SKILL.md" exit /b 1
          )
          for /f "usebackq delims=" %%V in ("%USERPROFILE%\.agents\skills\chanyong\VERSION") do if not "%%V"=="1.6.0" exit /b 1
